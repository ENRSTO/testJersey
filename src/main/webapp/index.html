<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Calcola IVA</title>
</head>
<body>
  <h2>Calcolo Prezzo con IVA (22%)</h2>

  <form id="formIva">
    <label>Articolo:</label>
    <input type="text" id="articolo" value="bici"><br><br>

    <label>Prezzo (€):</label>
    <input type="number" id="prezzo" value="600"><br><br>

    <button type="button" id="btnCalcola">Calcola IVA</button><br><br>

    <label>Prezzo con IVA (€):</label>
    <input type="text" id="prezzoIvato" readonly>
  </form>

  <script>
    document.getElementById("btnCalcola").addEventListener("click", function() {
      const articolo = document.getElementById("articolo").value;
      const prezzo = parseFloat(document.getElementById("prezzo").value);

      const payload = { articolo: articolo, prezzo: prezzo };

      fetch("http://localhost:8082/testJersey/rest/iva/calcola", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) throw new Error("Errore HTTP " + response.status);
        return response.json();
      })
      .then(data => {
        document.getElementById("prezzoIvato").value = data.prezzoIvato.toFixed(2);
      })
      .catch(error => console.error("Errore:", error));
    });
  </script>
</body>
</html>
